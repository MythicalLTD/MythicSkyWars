name: Nightly Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25-ea

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure Maven Toolchains
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>1.8</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_8_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>16</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_16_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>17</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_17_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_21_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_25_X64 }}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<revision>)[^<]+' pom.xml | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building nightly: ${NIGHTLY_VERSION}"

      - name: Run tests
        run: mvn test -Drevision=${{ steps.version.outputs.version }} -B --no-transfer-progress

      - name: Build
        run: mvn clean package -Drevision=${{ steps.version.outputs.version }} -B --no-transfer-progress -DskipTests

      - name: Delete old nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "MythicSkywars Nightly #${{ github.run_number }} (${{ steps.version.outputs.version }})"
          body: |
            ## MythicSkywars Nightly Build

            **Version:** `${{ steps.version.outputs.version }}`
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ---

            ⚠️ This is an automated nightly build. It may be unstable.
            Use release builds for production servers.

            ### Changes in this build
            ${{ github.event.head_commit.message }}
          prerelease: true
          files: |
            target/MythicSkywars-${{ steps.version.outputs.version }}.jar
