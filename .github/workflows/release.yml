name: Release Build

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25-ea

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure Maven Toolchains
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>1.8</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_8_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>16</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_16_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>17</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_17_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_21_X64 }}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration><jdkHome>${{ env.JAVA_HOME_25_X64 }}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Determine version from tag
        id: version
        run: |
          # Strip the 'v' prefix from the tag if present
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Build
        run: mvn clean package -Drevision=${{ steps.version.outputs.version }} -B --no-transfer-progress -DskipTests -Daether.checksumPolicy=warn

      - name: Upload release artifact to GitHub
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "target/MythicSkywars-${{ steps.version.outputs.version }}.jar" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          JAR_FILE="target/MythicSkywars-${{ steps.version.outputs.version }}.jar"
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="${{ github.event.release.body }}"

          # Build the version metadata JSON
          DATA=$(cat <<EOF
          {
            "name": "MythicSkywars v${VERSION}",
            "version_number": "${VERSION}",
            "changelog": $(echo "$CHANGELOG" | jq -Rs .),
            "dependencies": [
              {"project_id": "1u6JkXh5", "dependency_type": "required"},
              {"project_id": "z4HZZnLr", "dependency_type": "required"},
              {"project_id": "hXiIvTyT", "dependency_type": "optional"},
              {"project_id": "lKEzGugV", "dependency_type": "optional"},
              {"project_id": "w02MKsTg", "dependency_type": "optional"},
              {"project_id": "3wmN97b8", "dependency_type": "optional"}
            ],
            "game_versions": ["1.8.9","1.9.4","1.10.2","1.11.2","1.12.2","1.13.2","1.14.4","1.15.2","1.16.5","1.17.1","1.18.2","1.19.4","1.20.6","1.21.11", "26.1.2", "26.1.1","26.1"],
            "version_type": "release",
            "loaders": ["bukkit","spigot","paper", "waterfall", "purpur"],
            "featured": true,
            "project_id": "${MODRINTH_PROJECT_ID}",
            "file_parts": ["file"],
            "primary_file": "file"
          }
          EOF
          )

          curl -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: MythicalSystems/MythicSkywars/${{ steps.version.outputs.version }} (github-actions)" \
            -F "data=${DATA}" \
            -F "file=@${JAR_FILE}" \
            --fail-with-body
