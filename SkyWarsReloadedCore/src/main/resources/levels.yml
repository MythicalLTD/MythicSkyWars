xp-rewards:
  per-minute: 10
  per-teammate: 5
  game-win: 100
  per-kill: 10
  vip1-multiplier: 2
  vip2-multiplier: 3
  vip3-multiplier: 4
  vip4-multiplier: 5
  vip5-multiplier: 10

progress-bar:
  symbol: ■
  unlocked-color: '&b'
  locked-color: '&7'
  format: '&8 [{progress}&8]'
  segments: 10

levels:
  '1':
    name: '&7[{number}✩] '
    rankup-cost: 1000
  '2':
    name: '&7[{number}✩] '
    rankup-cost: 2000
  '3':
    name: '&7[{number}✩] '
    rankup-cost: 3000
  '4':
    name: '&7[{number}✩] '
    rankup-cost: 3500
  5-10:
    name: '&e[{number}✩] '
    rankup-cost: 5000
  11-20:
    name: '&a[{number}✩] '
    rankup-cost: 6000
  21-30:
    name: '&b[{number}✩] '
    rankup-cost: 7000
  31-40:
    name: '&c[{number}✩] '
    rankup-cost: 8000
  41-50:
    name: '&d[{number}✩] '
    rankup-cost: 9000
  51-60:
    name: '&e[{number}✩] '
    rankup-cost: 10000
  61-70:
    name: '&f[{number}✩] '
    rankup-cost: 11000
  71-80:
    name: '&1[{number}✩] '
    rankup-cost: 12000
  81-90:
    name: '&2[{number}✩] '
    rankup-cost: 13000
  91-100:
    name: '&3[{number}✩] '
    rankup-cost: 14000
  others:
    name: '&7[{number}✩] '
    rankup-cost: 15000

